<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Enforced here rather than as a header so it holds on any static
         host, including GitHub Pages, which cannot set headers at all.
         frame-ancestors is deliberately absent: it is header-only and
         browsers ignore it in a meta tag. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://api.rss2json.com; frame-src https://luma.com; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;600;700&family=Syne:wght@600&display=swap"
      rel="stylesheet"
    />
    <!--app-head-->
    <title>med-dev | Munich Health Tech Community</title>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
