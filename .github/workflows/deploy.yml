name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so an in-flight
# deploy finishes instead of leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Same gate as local: typecheck, lint, tests, then the prerendered build.
      # A broken build must not reach the live site.
      - run: npm run lint
      - run: npm test

      # This deploys to a GitHub Pages *project* page, so the site lives at
      # /<repo>/ rather than a domain root, and every URL is built against
      # BASE_URL. NOINDEX keeps this preview out of search results so it never
      # competes with the real site.
      #
      # To move to the custom domain: drop these three env vars, add a
      # public/CNAME holding the domain, and point DNS at GitHub. Nothing else
      # in the codebase changes.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          VITE_NOINDEX: "true"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
