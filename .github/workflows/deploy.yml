name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so an in-flight
# deploy finishes instead of leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          # From .nvmrc, so CI and local cannot drift. jsdom 30 and undici 8
          # both refuse to load on Node 20, which only showed up here.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Same gate as local: typecheck, lint, tests, then the prerendered build.
      # A broken build must not reach the live site.
      - run: npm run lint
      - run: npm test

      # Bakes the Luma calendar into the bundle: api.lu.ma sends no CORS
      # headers, so this cannot happen in the browser. On a Luma outage the
      # build falls back to the committed src/content/events.generated.ts.
      - run: npm run fetch:events
        continue-on-error: true

      # This deploys to a GitHub Pages *project* page, so the site lives at
      # /<repo>/ rather than a domain root, and every URL is built against
      # BASE_URL. NOINDEX keeps this preview out of search results so it never
      # competes with the real site.
      #
      # To move to the custom domain: drop these three env vars, add a
      # public/CNAME holding the domain, and point DNS at GitHub. Nothing else
      # in the codebase changes.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          VITE_NOINDEX: "true"

      # enablement turns Pages on via the API if it is not configured yet, so
      # a fresh clone or a transferred repo deploys without a manual setting.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
